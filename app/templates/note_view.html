{% extends "base.html" %}

{% block body %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<div class="container mt-4">
    <div class="glass-card ql-snow">
        <div class="meta-bar">
            <span>Tạo lúc: {{ note.created_at.strftime('%d/%m/%Y %H:%M') }}</span>
            <span>Lượt xem: {{ note.view_count }}</span>
        </div>
        
        {% if note.title %}
        <h1 class="gradient-text">{{ note.title }}</h1>
        {% else %}
        <h1 class="gradient-text">Ghi chú</h1>
        {% endif %}

        <div class="note-content ql-editor">{{ note.content | safe }}</div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button class="btn" onclick="copyNoteContent()">Copy Nội dung</button>
            <a href="/" class="btn btn-secondary">Về trang chủ</a>
        </div>
    </div>
</div>

<!-- Quill.js CDN for styling -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

{% endblock %}
