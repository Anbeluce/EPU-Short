{% extends "base.html" %}

{% block title %}Nhập mật khẩu{% endblock %}

{% block body %}
<div class="password-page container">
    <div class="glass-card text-center {% if error %}shake{% endif %}" style="max-width: 500px; width: 100%;">
        <div class="icon-large icon-pulse"><i class="ph ph-lock-key" style="font-size: 3rem;"></i></div>
        <h2>Nội dung được bảo vệ</h2>
        <p class="text-secondary mb-4">
            {% if type == 'link' %}
                Link này yêu cầu mật khẩu để truy cập.
            {% else %}
                Note này yêu cầu mật khẩu để xem.
            {% endif %}
        </p>

        {% if error %}
        <div class="badge badge-red mb-3" style="font-size: 0.9rem; display: block;">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="input-group text-left">
                <div class="password-wrapper pwd-input">
                    <input type="password" name="password" placeholder="Nhập mật khẩu" required autofocus>
                    <button type="button" class="toggle-password" onclick="togglePassword('pwd-input')"><i class="ph ph-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Mở khóa</button>
        </form>
    </div>
</div>
{% endblock %}
